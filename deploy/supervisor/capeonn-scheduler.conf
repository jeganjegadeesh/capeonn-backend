; ==============================================================================
; Capeonn Production Cron Task Scheduler Supervision
; (Alternative to system crontab, keeps scheduler alive indefinitely)
; ==============================================================================

[program:capeonn-scheduler]
process_name=%(program_name)s
command=/bin/bash -c "while [ true ]; do (php /var/www/capeonn/capeonn-backend/artisan schedule:run --verbose --no-interaction &); sleep 60; done"
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/capeonn-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
priority=200
