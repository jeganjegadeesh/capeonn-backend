; ==============================================================================
; Capeonn Production Background Queue Worker Supervision
; Supervisor program configuration for Laravel queue:work processes
; ==============================================================================

[program:capeonn-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/capeonn/capeonn-backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600 --timeout=120 --memory=256
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/capeonn-worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
priority=100
